<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.StatusCode}} Error — Groupie Tracker</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
 
  <header>
    <div class="header-inner">
      <div class="logo">Groupie<span>Tracker</span></div>
    </div>
  </header>
 
  <main>
    <div class="error-page">
      <div class="error-code">{{.StatusCode}}</div>
      <div class="error-line"></div>
      <p class="error-msg">{{.Message}}</p>
      <a class="error-home" href="/">Go back home</a>
    </div>
  </main>
 
  <footer>Groupie Tracker &mdash; reboot01 project</footer>
 
</body>
</html>
